<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria d'Arte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Intestazione del sito -->
  <header class="navbar">
    <h1 class="logo">Arte & Studio</h1>
    <nav>
      <a href="#galleria">Opere</a>
      <a href="#chi-siamo">Chi Siamo</a>
      <a href="#contatti">Contatti</a>
    </nav>
  </header>

  <!-- Griglia della Galleria -->
  <main id="galleria" class="gallery-container">
    
    <div class="art-card">
      <img src="opera1.jpg" alt="Titolo Opera 1">
      <div class="art-info">
        <h3>Ritratto No. 1</h3>
        <p>Olio su tela — 50x70 cm</p>
      </div>
    </div>

    <div class="art-card">
      <img src="opera2.jpg" alt="Titolo Opera 2">
      <div class="art-info">
        <h3>Paesaggio astratto</h3>
        <p>Acrilico su legno — 80x100 cm</p>
      </div>
    </div>

    <div class="art-card">
      <img src="opera3.jpg" alt="Titolo Opera 3">
      <div class="art-info">
        <h3>Studio di figura</h3>
        <p>Matita su carta — 30x40 cm</p>
      </div>
    </div>

  </main>

</body>
</html>
